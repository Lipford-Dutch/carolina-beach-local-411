name: Bug report
description: Report a problem with the Carolina Beach 411 site.
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      description: Example: iPhone Safari, Windows Chrome, Android Firefox.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest steps that trigger the issue.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked that this is not a stale vendor/source update.
          required: true
